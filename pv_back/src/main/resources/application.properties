spring.application.name=pv_back
server.port=8080

# CONFIGURACIÓN MARIADB
spring.datasource.url=jdbc:mariadb://db-mariadb:3306/inventario?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=pos_user
spring.datasource.password=pos_password
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# DEVTOOLS HOT-RELOAD
spring.devtools.restart.enabled=true
